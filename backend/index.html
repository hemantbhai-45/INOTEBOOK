<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Fetch Example</title>
</head>
<body>

<h1>Display Message from Backend</h1>
<div id="message"></div>

<script>
    // Fetch data from the '/api/auth' endpoint
    fetch('http://localhost:3000/api/auth')
        .then(response => response.json())
        .then(data => {
            console.log(data); // Log the response to the console
            document.getElementById('message').innerText = data[0].message; // Display the message in the HTML
        })
        .catch(error => {
            console.error('Error:', error);
        });
</script>

</body>
</html>
